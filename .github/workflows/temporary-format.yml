name: Temporary format touched files

on:
  push:
    branches: [fix/sync-package-lock]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/sync-package-lock
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format files and remove this temporary workflow
        run: |
          npx prettier --write src/rate_limit.js test/api.test.js test/rate_limit.test.js
          rm .github/workflows/temporary-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format security changes"
          git push
