name: Temporary dependency audit refresh

on:
  push:
    branches: [fix/sync-package-lock]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/sync-package-lock
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Report full audit
        run: |
          npm audit --json > full-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("full-audit.json", "utf8"));
            console.log("FULL_AUDIT_SUMMARY", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log("AUDIT_ITEM", JSON.stringify({
                name, severity: item.severity, direct: item.isDirect,
                fixAvailable: item.fixAvailable,
                via: item.via.map((entry) => typeof entry === "string" ? entry : entry.name)
              }));
            }
          '
          rm -f full-audit.json .github/workflows/temporary-dependency-audit-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refresh lockfile and audit dependencies"
          git push
