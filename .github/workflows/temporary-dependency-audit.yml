name: Temporary dependency audit

on:
  push:
    branches: [fix/sync-package-lock]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply non-breaking security fixes
        run: npm audit fix
      - name: Verify code and tests
        run: npm run check
      - name: Report remaining vulnerabilities
        run: |
          npm audit --json > audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            console.log("SUMMARY", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({name, severity:item.severity, isDirect:item.isDirect, range:item.range, fixAvailable:item.fixAvailable}));
            }
          '
      - name: Commit safe dependency updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: apply non-breaking npm security updates"
            git push
          else
            echo "No dependency changes were needed."
          fi
