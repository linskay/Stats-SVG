name: Repair npm lockfile

on:
  push:
    branches: [fix/sync-package-lock]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/sync-package-lock
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Run project checks
        run: npm run check
      - name: Commit only the regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-npm-lockfile.yml
          git add package-lock.json
          git diff --cached --quiet && { echo "No lockfile changes produced"; exit 1; }
          git commit -m "fix: synchronize npm lockfile"
          git push origin HEAD:fix/sync-package-lock
